# ===== Bộ chạy production (đọc DEPLOY.md trước khi dùng) =====
# Dùng lệnh: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# Dịch vụ cloudflared chỉ chạy khi bật profile "tunnel".

name: quy-prod

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    image: quy-backend:prod
    restart: unless-stopped
    env_file: .env.prod
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"                      # chỉ web (Caddy) gọi được, không mở ra ngoài

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: quy-web:prod
    restart: unless-stopped
    depends_on:
      - backend
    env_file: .env.prod
    ports:
      - "${WEB_PORT:-80}:80"        # đổi WEB_PORT trong .env.prod nếu cổng 80 bận

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    env_file: .env.prod
    profiles: ["tunnel"]            # chỉ chạy khi: --profile tunnel
    depends_on:
      - web

volumes:
  pgdata:
